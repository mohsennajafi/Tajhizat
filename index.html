<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f1f5f4;--card:#fff;--tx:#12302d;--mu:#5f7774;--pr:#0f766e;--pr2:#14b8a6;--bd:#d5e2e0;--dg:#dc2626;--ok:#16a34a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0d1a19;--card:#152827;--tx:#e6f2f0;--mu:#8fb0ac;--pr:#14b8a6;--pr2:#0f766e;--bd:#264240}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Vazirmatn",Tahoma,sans-serif;line-height:1.7}
header{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;padding:18px 16px 54px;text-align:center}
header h1{margin:0;font-size:20px}header p{margin:2px 0 0;font-size:13px;opacity:.9}
main{max-width:920px;margin:-38px auto 24px;padding:0 12px}
.tabs{display:flex;gap:8px;background:var(--card);padding:6px;border-radius:14px;box-shadow:0 4px 16px #0002}
.tabs button{flex:1;border:0;background:none;color:var(--mu);font:600 15px inherit;font-family:inherit;padding:10px;border-radius:10px;cursor:pointer}
.tabs button.on{background:var(--pr);color:#fff}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-top:12px}
.card h2{margin:0 0 10px;font-size:16px;color:var(--pr)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:2px}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;font-size:15px}
input:focus,select:focus{outline:2px solid var(--pr2)}
.btn{border:0;border-radius:10px;padding:10px 16px;font:600 14px inherit;font-family:inherit;cursor:pointer;background:var(--pr);color:#fff}
.btn.s{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}.btn.d{background:var(--dg)}.btn.x{background:var(--ok)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
.chip{display:inline-block;padding:1px 10px;border-radius:99px;font-size:12px;font-weight:600}
.chip.a{background:#16a34a22;color:var(--ok)}.chip.i{background:#dc262622;color:var(--dg)}
.item{border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-top:8px}
.item b{font-size:15px}.item small{display:block;color:var(--mu);font-size:12px}
.item .row{margin-top:8px}.item .btn{padding:6px 12px;font-size:13px}
.empty{text-align:center;color:var(--mu);padding:18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--bg);border:1px solid var(--bd);border-radius:12px;text-align:center;padding:8px}
.tile b{display:block;font-size:24px;line-height:1.3}.tile span{font-size:12px;color:var(--mu)}
.tile.a b{color:var(--ok)}.tile.i b{color:var(--dg)}
.note{font-size:12px;color:var(--mu);margin-top:8px}
footer{max-width:920px;margin:0 auto 20px;padding:0 12px}
.dev{text-align:center;font-size:13px;color:var(--mu)}.dev a{color:var(--pr);text-decoration:none;font-weight:600}
.ltr{direction:ltr;unicode-bidi:embed}
.ov{position:fixed;inset:0;z-index:50;background:linear-gradient(135deg,var(--pr),var(--pr2));display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.ov .card{width:100%;max-width:380px;margin:0}
.ub{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:8px;font-size:13px;flex-wrap:wrap}
.ub button{border:1px solid #fff9;background:#fff2;color:#fff;border-radius:99px;padding:1px 12px;font:inherit;cursor:pointer}
#prt{display:none}
@media print{
 @page{size:landscape;margin:12mm}
 body>*{display:none!important}
 body>#prt{display:block!important;background:#fff;color:#000}
 #prt h2{margin:0 0 4px}#prt p{margin:0 0 10px}
 #prt table{width:100%;border-collapse:collapse;font-size:11px}
 #prt th,#prt td{border:1px solid #444;padding:4px 6px;text-align:right}
 #prt th{background:#e5e5e5}
}
</style>

<main>

<div id="login" class="ov" style="display:none"></div>
<div id="prt"></div>
<script>
const ST=[["active","فعال"],["inactive","غیرفعال"]];
const CFG={
eq:{title:"تجهیزات",f:[["name","نام دستگاه"],["location","مکان استفاده"],["model","مدل"],["prodYear","سال تولید","number"],["buyYear","سال خرید","number"],["maker","شرکت تولیدکننده"],["support","شرکت پشتیبان"],["status","وضعیت","st"],["serial","سریال دستگاه"],["asset","شماره اموال"]],main:"name"},
sys:{title:"سیستم‌ها",f:[["location","مکان"],["name","نام سیستم"],["ip","آی‌پی سیستم"],["hdd","هارددیسک"],["ram","رم"],["cpu","پردازنده"],["board","مادربورد"],["case","کیس"],["mouse","مدل موس"],["keyboard","مدل کیبورد"],["status","وضعیت","st"]],main:"name"}
};
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function blank(){return{centers:[],sel:{eq:null,sys:null},items:{eq:[],sys:[]}}}
function load(){
 try{
  const r=localStorage.getItem("eqreg2");
  if(r){const p=JSON.parse(r);if(p&&p.centers&&p.items)return p}
  const o=localStorage.getItem("eqreg");
  if(o){
   const p=JSON.parse(o),n=blank();
   ["eq","sys"].forEach(t=>{
    const d=p[t];if(!d)return;
    let cid=null;
    if(d.c){
     let f=n.centers.find(x=>x.province===d.c.province&&x.city===d.c.city&&x.center===d.c.center);
     if(!f){f={id:uid(),province:d.c.province,city:d.c.city,center:d.c.center};n.centers.push(f)}
     cid=f.id;n.sel[t]=cid;
    }
    (d.items||[]).forEach(it=>n.items[t].push(Object.assign({},it,{id:uid(),cid:cid})));
   });
   return n;
  }
 }catch(e){}
 return blank();
}
let S=load(),cur="eq",editId=null,newC=false,editCid=null,q="",ME=null,U=[],editU=null;
function save(){try{localStorage.setItem("eqreg2",JSON.stringify(S))}catch(e){}}
function esc(v){return String(v==null?"":v).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function stLabel(v){return v==="inactive"?"غیرفعال":"فعال"}
function val(id){return document.getElementById(id).value.trim()}
function cLabel(c){return c.province+" / "+c.city+" / "+c.center}
function curCenter(){return visibleCenters().find(x=>x.id===S.sel[cur])}
function field(f,v){
 const id="f_"+f[0];
 if(f[2]==="st")return '<div><label>'+f[1]+'</label><select id="'+id+'">'+ST.map(s=>'<option value="'+s[0]+'"'+((v||"active")===s[0]?" selected":"")+'>'+s[1]+'</option>').join("")+'</select></div>';
 return '<div><label>'+f[1]+'</label><input id="'+id+'" type="'+(f[2]==="number"?"number":"text")+'"'+(f[2]==="number"?' inputmode="numeric"':"")+' value="'+esc(v)+'"></div>';
}
function render(){
 if(cur==="users"){renderUsers();return}
 const c=CFG[cur];
 ["eq","sys","users"].forEach(t=>{document.getElementById("t-"+t).className=t===cur?"on":""});
 if(!curCenter()){const v=visibleCenters();S.sel[cur]=v.length?v[0].id:null}
 const ctr=curCenter();
 let h="";
 if(!ctr||newC||editCid){
  const cc=editCid?(S.centers.find(x=>x.id===editCid)||{}):{};
  h+='<div class="card"><h2>'+(editCid?"ویرایش مرکز":"اطلاعات مرکز")+' ('+c.title+')</h2><div class="grid">'+
   [["province","استان"],["city","شهرستان"],["center","نام مرکز"]].map(x=>'<div><label>'+x[1]+'</label><input id="c_'+x[0]+'" value="'+esc(cc[x[0]])+'"></div>').join("")+
   '</div><div class="row"><button class="btn" onclick="saveCenter()">ثبت و ادامه ◀</button>'+(ctr?'<button class="btn s" onclick="cancelC()">انصراف</button>':"")+'</div></div>';
 }else{
  const mine=S.items[cur].filter(i=>i.cid===ctr.id),act=mine.filter(i=>i.status!=="inactive").length;
  const allN=S.items[cur].length,allA=S.items[cur].filter(i=>i.status!=="inactive").length;
  h+='<div class="card"><label>مرکز فعال</label><select onchange="selC(this.value)">'+visibleCenters().map(x=>'<option value="'+x.id+'"'+(x.id===ctr.id?" selected":"")+'>'+esc(cLabel(x))+'</option>').join("")+'</select>'+
   (ADM()?'<div class="row"><button class="btn s" onclick="newC=true;render()">➕ مرکز جدید</button><button class="btn s" onclick="editCid=S.sel[cur];render()">✏️ ویرایش مرکز</button><button class="btn d" onclick="delCenter()">🗑️ حذف مرکز</button></div>':"")+'</div>';
  h+='<div class="card"><h2>📊 آمار '+c.title+' این مرکز</h2><div class="stats"><div class="tile"><b>'+mine.length+'</b><span>کل</span></div><div class="tile a"><b>'+act+'</b><span>فعال</span></div><div class="tile i"><b>'+(mine.length-act)+'</b><span>غیرفعال</span></div></div>'+(ADM()?'<div class="note">همهٔ مراکز: '+S.centers.length+' مرکز، '+allN+' مورد ('+allA+' فعال، '+(allN-allA)+' غیرفعال)</div>':"")+'</div>';
  const v=editId?(S.items[cur].find(i=>i.id===editId)||{}):{};
  h+='<div class="card"><h2>'+(editId?"ویرایش":"ثبت")+' '+(cur==="eq"?"دستگاه":"سیستم")+'</h2><div class="grid">'+c.f.map(f=>field(f,v[f[0]])).join("")+'</div><div class="row"><button class="btn" onclick="saveItem()">'+(editId?"ذخیره ویرایش":"ثبت")+'</button>'+(editId?'<button class="btn s" onclick="editId=null;render()">انصراف</button>':"")+'</div></div>';
  h+='<div class="card"><h2 style="margin:0 0 6px">فهرست ('+mine.length+')</h2><div class="row" style="margin:0 0 10px"><button class="btn x" onclick="exportX(false)">⬇️ اکسل این مرکز</button>'+(ADM()?'<button class="btn x" onclick="exportX(true)">⬇️ اکسل همهٔ مراکز</button>':"")+'<button class="btn s" onclick="document.getElementById(\'imp\').click()">⬆️ ورود از اکسل</button><button class="btn s" onclick="printX()">🖨️ PDF / چاپ</button></div><input id="imp" type="file" accept=".xlsx,.xls" hidden onchange="importX(this)"><input id="q" placeholder="🔍 جستجو..." value="'+esc(q)+'" oninput="q=this.value;renderList()"><div id="lst"></div></div>';
 }
 if(ADM())h+='<div class="card"><h2>💾 پشتیبان‌گیری و بازیابی</h2><div class="row" style="margin-top:0"><button class="btn" onclick="backupX()">⬇️ دانلود پشتیبان کل اطلاعات</button><button class="btn s" onclick="document.getElementById(\'rst\').click()">⬆️ بازیابی از پشتیبان</button></div><input id="rst" type="file" accept=".json,application/json" hidden onchange="restoreX(this)"><div class="note">پشتیبان شامل همهٔ مراکز، تجهیزات و سیستم‌هاست. بازیابی، اطلاعات فعلی را جایگزین می‌کند.</div></div>';
 document.getElementById("view").innerHTML=h;
 renderList();
}
function renderList(){
 const el=document.getElementById("lst");if(!el)return;
 const c=CFG[cur],ctr=curCenter(),t=q.trim().toLowerCase();
 const mine=S.items[cur].filter(i=>i.cid===ctr.id);
 let h="",n=0;
 mine.forEach(it=>{
  if(t&&!c.f.some(f=>String(it[f[0]]||"").toLowerCase().indexOf(t)>=0))return;
  n++;
  h+='<div class="item"><b>'+esc(it[c.main])+'</b> <span class="chip '+(it.status==="inactive"?"i":"a")+'">'+stLabel(it.status)+'</span><small>'+c.f.filter(f=>f[0]!==c.main&&f[0]!=="status"&&it[f[0]]).map(f=>f[1]+": "+esc(it[f[0]])).join(" • ")+'</small><div class="row"><button class="btn s" onclick="edit(\''+it.id+'\')">✏️ ویرایش</button><button class="btn d" onclick="del(\''+it.id+'\')">🗑️ حذف</button></div></div>';
 });
 el.innerHTML=n?h:'<div class="empty">'+(mine.length?"موردی پیدا نشد":"هنوز موردی ثبت نشده است")+'</div>';
}
function selC(id){S.sel[cur]=id;editId=null;q="";save();render()}
function cancelC(){newC=false;editCid=null;render()}
function saveCenter(){
 const o={province:val("c_province"),city:val("c_city"),center:val("c_center")};
 if(!o.province||!o.city||!o.center){alert("لطفاً استان، شهرستان و نام مرکز را وارد کنید.");return}
 if(editCid){
  const c=S.centers.find(x=>x.id===editCid);Object.assign(c,o);
 }else{
  let f=S.centers.find(x=>x.province===o.province&&x.city===o.city&&x.center===o.center);
  if(!f){f=Object.assign({id:uid()},o);S.centers.push(f)}
  S.sel[cur]=f.id;
 }
 newC=false;editCid=null;q="";save();render();
}
function delCenter(){
 const ctr=curCenter();
 if(!ctr||!confirm("مرکز «"+ctr.center+"» به همراه همهٔ تجهیزات و سیستم‌های آن حذف شود؟"))return;
 S.centers=S.centers.filter(x=>x.id!==ctr.id);
 ["eq","sys"].forEach(t=>{S.items[t]=S.items[t].filter(i=>i.cid!==ctr.id);if(S.sel[t]===ctr.id)S.sel[t]=null});
 editId=null;save();render();
}
function saveItem(){
 const c=CFG[cur],o={};
 c.f.forEach(f=>{o[f[0]]=val("f_"+f[0])});
 if(!o[c.main]){alert("نام را وارد کنید.");return}
 if(editId){
  const i=S.items[cur].findIndex(x=>x.id===editId);
  S.items[cur][i]=Object.assign({},S.items[cur][i],o);
 }else S.items[cur].push(Object.assign({id:uid(),cid:S.sel[cur]},o));
 editId=null;save();render();
}
function edit(id){editId=id;render();window.scrollTo({top:0,behavior:"smooth"})}
function del(id){if(confirm("این مورد حذف شود؟")){S.items[cur]=S.items[cur].filter(i=>i.id!==id);editId=null;save();render()}}
function exportX(all){
 const c=CFG[cur],ctr=curCenter();
 const list=S.items[cur].filter(i=>all||i.cid===ctr.id);
 if(!list.length){alert("چیزی برای خروجی وجود ندارد.");return}
 const head=["استان","شهرستان","نام مرکز"].concat(c.f.map(f=>f[1]));
 const rows=list.map(it=>{
  const m=S.centers.find(x=>x.id===it.cid)||{};
  return [m.province||"",m.city||"",m.center||""].concat(c.f.map(f=>f[2]==="st"?stLabel(it[f[0]]):(it[f[0]]||"")));
 });
 const ws=XLSX.utils.aoa_to_sheet([head].concat(rows));
 ws["!cols"]=head.map(()=>({wch:18}));
 const wb=XLSX.utils.book_new();
 wb.Workbook={Views:[{RTL:true}]};
 XLSX.utils.book_append_sheet(wb,ws,c.title);
 XLSX.writeFile(wb,c.title+"-"+(all?"همه-مراکز":ctr.center)+".xlsx");
}
function importX(inp){
 const f=inp.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=e=>{
  try{
   const wb=XLSX.read(e.target.result,{type:"array"});
   const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""});
   const c=CFG[cur],here=curCenter();let add=0;
   rows.forEach(r=>{
    const o={};
    c.f.forEach(f=>{let v=r[f[1]];if(f[2]==="st")v=String(v).trim()==="غیرفعال"?"inactive":"active";o[f[0]]=v==null?"":String(v)});
    if(!o[c.main])return;
    let rc={province:String(r["استان"]||"").trim(),city:String(r["شهرستان"]||"").trim(),center:String(r["نام مرکز"]||"").trim()};
    let m;
    if(rc.center&&ADM()){
     m=S.centers.find(x=>x.province===rc.province&&x.city===rc.city&&x.center===rc.center);
     if(!m){m=Object.assign({id:uid()},rc);S.centers.push(m)}
    }else if(here)m=here;else return;
    S.items[cur].push(Object.assign({id:uid(),cid:m.id},o));add++;
   });
   save();render();alert(add+" مورد وارد شد.");
  }catch(err){alert("فایل اکسل قابل خواندن نیست.")}
  inp.value="";
 };
 r.readAsArrayBuffer(f);
}
function printX(){
 const c=CFG[cur],ctr=curCenter(),mine=S.items[cur].filter(i=>i.cid===ctr.id);
 if(!mine.length){alert("چیزی برای چاپ وجود ندارد.");return}
 document.getElementById("prt").innerHTML='<h2>گزارش '+c.title+'</h2><p>'+esc(cLabel(ctr))+' — '+new Date().toLocaleDateString("fa-IR")+'</p><table><tr><th>#</th>'+c.f.map(f=>'<th>'+f[1]+'</th>').join("")+'</tr>'+mine.map((it,i)=>'<tr><td>'+(i+1)+'</td>'+c.f.map(f=>'<td>'+esc(f[2]==="st"?stLabel(it.status):it[f[0]])+'</td>').join("")+'</tr>').join("")+'</table>';
 window.print();
}
function backupX(){
 const b=new Blob([JSON.stringify(S)],{type:"application/json"});
 const a=document.createElement("a");
 a.href=URL.createObjectURL(b);a.download="backup-"+new Date().toISOString().slice(0,10)+".json";
 document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}
function restoreX(inp){
 const f=inp.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=e=>{
  try{
   const p=JSON.parse(e.target.result);
   if(!p||!Array.isArray(p.centers)||!p.items||!p.sel)throw new Error("bad");
   if(confirm("اطلاعات فعلی با پشتیبان جایگزین شود؟")){
    p.items.eq=p.items.eq||[];p.items.sys=p.items.sys||[];
    S=p;editId=null;newC=false;editCid=null;q="";save();render();
   }
  }catch(err){alert("فایل پشتیبان معتبر نیست.")}
  inp.value="";
 };
 r.readAsText(f);
}
const ADM=()=>!!ME&&ME.role==="admin";
function visibleCenters(){return ADM()?S.centers:S.centers.filter(x=>ME&&x.id===ME.cid)}
function nd(s){return String(s).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d))}
const enc=new TextEncoder();
function hex(b){return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("")}
async function hashPw(pw,salt){
 const k=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveBits"]);
 return hex(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:enc.encode(salt),iterations:100000},k,256));
}
function saveUsers(){try{localStorage.setItem("eqreg_udraft",JSON.stringify({users:U}))}catch(e){}}
async function loadUsers(){
 let draft=null,remote=null,cached=null;
 try{const d=localStorage.getItem("eqreg_udraft");if(d)draft=JSON.parse(d)}catch(e){}
 try{
  const r=await fetch("users.json?t="+Date.now(),{cache:"no-store"});
  if(r.ok){remote=await r.json();try{localStorage.setItem("eqreg_ucache",JSON.stringify(remote))}catch(e){}}
 }catch(e){}
 if(!remote){try{const c=localStorage.getItem("eqreg_ucache");if(c)cached=JSON.parse(c)}catch(e){}}
 const src=draft||remote||cached;
 U=src&&Array.isArray(src.users)?src.users:[];
}
async function boot(){
 await loadUsers();
 let sid=null;try{sid=localStorage.getItem("eqreg_sess")}catch(e){}
 const u=U.find(x=>x.username===sid&&x.active!==false);
 if(u)enter(u);else showLogin();
}
function showLogin(msg){
 const o=document.getElementById("login");o.style.display="flex";
 document.getElementById("ubar").innerHTML="";
 document.getElementById("t-users").style.display="none";
 if(!U.length){
  o.innerHTML='<div class="card"><h2>🔐 ایجاد حساب مدیر</h2><div class="note" style="margin:0 0 8px">اولین استفاده: حساب مدیر را تعریف کنید.</div><label>نام کاربری مدیر (حروف و عدد انگلیسی)</label><input id="l_u" autocomplete="off"><label>رمز عبور (حداقل ۴ کاراکتر)</label><input id="l_p" type="password" autocomplete="new-password"><label>نام و نام خانوادگی</label><input id="l_n"><div class="row"><button class="btn" onclick="setupAdmin()">ایجاد و ورود</button></div></div>';
 }else{
  o.innerHTML='<div class="card"><h2>🔐 ورود به برنامه</h2><label>نام کاربری</label><input id="l_u" autocomplete="username"><label style="margin-top:8px">رمز عبور</label><input id="l_p" type="password" autocomplete="current-password" onkeydown="if(event.key===\'Enter\')doLogin()"><div class="note" style="color:var(--dg)">'+(msg||"")+'</div><div class="row"><button class="btn" onclick="doLogin()">ورود</button></div></div>';
 }
}
async function setupAdmin(){
 const un=nd(val("l_u")),pw=nd(document.getElementById("l_p").value),nm=val("l_n");
 if(!/^[A-Za-z0-9_.@-]+$/.test(un)||pw.length<4||!nm){alert("نام کاربری (حروف و عدد انگلیسی)، رمز (حداقل ۴ کاراکتر) و نام را وارد کنید.");return}
 try{
  const salt=uid()+uid();
  U=[{username:un,salt:salt,hash:await hashPw(pw,salt),role:"admin",first:nm,last:"",position:"مدیر",active:true}];
 }catch(e){alert("برای ورود، برنامه باید با آدرس https باز شود.");return}
 saveUsers();enter(U[0]);
}
async function doLogin(){
 const un=nd(val("l_u")),pw=nd(document.getElementById("l_p").value);
 const u=U.find(x=>x.username===un);
 try{
  if(!u||u.active===false||await hashPw(pw,u.salt)!==u.hash){showLogin("نام کاربری یا رمز عبور اشتباه است.");return}
 }catch(e){alert("برای ورود، برنامه باید با آدرس https باز شود.");return}
 enter(u);
}
function enter(u){
 ME=Object.assign({},u);
 try{localStorage.setItem("eqreg_sess",u.username)}catch(e){}
 if(u.role!=="admin"){
  let m=S.centers.find(x=>x.province===u.province&&x.city===u.city&&x.center===u.center);
  if(!m){m={id:uid(),province:u.province||"",city:u.city||"",center:u.center||""};S.centers.push(m)}
  ME.cid=m.id;S.sel.eq=m.id;S.sel.sys=m.id;save();
 }
 const o=document.getElementById("login");o.style.display="none";o.innerHTML="";
 document.getElementById("t-users").style.display=u.role==="admin"?"":"none";
 document.getElementById("ubar").innerHTML='👤 '+esc((u.first+" "+(u.last||"")).trim())+(u.position?" — "+esc(u.position):"")+' <button onclick="logout()">خروج</button>';
 cur="eq";editId=null;newC=false;editCid=null;editU=null;q="";render();
}
function logout(){try{localStorage.removeItem("eqreg_sess")}catch(e){}ME=null;showLogin()}
function renderUsers(){
 ["eq","sys","users"].forEach(t=>{document.getElementById("t-"+t).className=t===cur?"on":""});
 const ed=editU!==null,e=ed?(U.find(x=>x.username===editU)||{}):{};
 const fl=[["u_un","نام کاربری (حروف و عدد انگلیسی، مثلاً 123321)",e.username,ed],["u_pw","رمز عبور"+(ed?" (خالی = بدون تغییر)":""),"",false],["u_fn","نام",e.first,false],["u_ln","نام خانوادگی",e.last,false],["u_ps","سمت",e.position,false],["u_pv","استان",e.province,false],["u_ct","شهرستان",e.city,false],["u_cn","نام مرکز",e.center,false]];
 let h='<div class="card"><h2>'+(ed?"ویرایش کاربر":"تعریف کاربر جدید")+'</h2><div class="grid">'+fl.map(x=>'<div><label>'+x[1]+'</label><input id="'+x[0]+'" value="'+esc(x[2])+'"'+(x[3]?" readonly":"")+' autocomplete="off"></div>').join("")+
  '<div><label>نقش</label><select id="u_rl"><option value="user"'+(e.role!=="admin"?" selected":"")+'>کاربر (فقط مرکز خودش)</option><option value="admin"'+(e.role==="admin"?" selected":"")+'>مدیر (همهٔ مراکز)</option></select></div></div><div class="row"><button class="btn" onclick="saveUser()">'+(ed?"ذخیره":"➕ تعریف کاربر")+'</button>'+(ed?'<button class="btn s" onclick="editU=null;render()">انصراف</button>':"")+'</div></div>';
 h+='<div class="card"><div class="bar"><h2 style="margin:0">کاربران ('+U.length+')</h2><button class="btn x" onclick="downloadUsers()">⬇️ دانلود users.json</button></div><div class="note">بعد از هر تغییر، فایل users.json را دانلود کنید و در مخزن GitHub (کنار index.html) جایگزین کنید تا برای دستگاه‌های کاربران اعمال شود.</div>';
 U.forEach(u=>{
  const un=esc(u.username);
  h+='<div class="item"><b>'+esc((u.first+" "+(u.last||"")).trim())+'</b> <span class="chip '+(u.active===false?"i":"a")+'">'+(u.active===false?"غیرفعال":"فعال")+'</span>'+(u.role==="admin"?' <span class="chip a">مدیر</span>':"")+'<small class="ltr">'+un+'</small><small>'+esc([u.position,u.province,u.city,u.center].filter(Boolean).join(" • "))+'</small><div class="row"><button class="btn s" onclick="editUser(\''+un+'\')">✏️ ویرایش</button>'+(u.username!==ME.username?'<button class="btn s" onclick="toggleU(\''+un+'\')">'+(u.active===false?"فعال‌سازی":"غیرفعال‌سازی")+'</button><button class="btn d" onclick="delU(\''+un+'\')">🗑️ حذف</button>':"")+'</div></div>';
 });
 h+='</div>';
 document.getElementById("view").innerHTML=h;
}
function editUser(un){editU=un;renderUsers();window.scrollTo({top:0,behavior:"smooth"})}
function toggleU(un){const u=U.find(x=>x.username===un);if(u&&un!==ME.username){u.active=u.active===false;saveUsers();renderUsers()}}
function delU(un){if(un!==ME.username&&confirm("کاربر «"+un+"» حذف شود؟")){U=U.filter(x=>x.username!==un);saveUsers();renderUsers()}}
async function saveUser(){
 const un=nd(val("u_un")),pw=nd(document.getElementById("u_pw").value);
 const o={first:val("u_fn"),last:val("u_ln"),position:val("u_ps"),province:val("u_pv"),city:val("u_ct"),center:val("u_cn"),role:document.getElementById("u_rl").value};
 const isNew=editU===null;
 if(!isNew&&editU===ME.username)o.role="admin";
 if(!/^[A-Za-z0-9_.@-]+$/.test(un)){alert("نام کاربری باید فقط حروف و عدد انگلیسی باشد.");return}
 if(!o.first||(o.role!=="admin"&&(!o.province||!o.city||!o.center))){alert("نام و اطلاعات مرکز (استان، شهرستان، نام مرکز) الزامی است.");return}
 if(isNew&&pw.length<4){alert("رمز عبور حداقل ۴ کاراکتر باشد.");return}
 if(isNew&&U.some(x=>x.username===un)){alert("این نام کاربری قبلاً تعریف شده است.");return}
 try{
  if(isNew){const salt=uid()+uid();U.push(Object.assign({username:un,salt:salt,hash:await hashPw(pw,salt),active:true},o))}
  else{const u=U.find(x=>x.username===editU);Object.assign(u,o);if(pw){u.salt=uid()+uid();u.hash=await hashPw(pw,u.salt)}}
 }catch(err){alert("خطا در رمزنگاری؛ برنامه را با آدرس https باز کنید.");return}
 editU=null;saveUsers();renderUsers();
}
function downloadUsers(){
 const b=new Blob([JSON.stringify({users:U},null,1)],{type:"application/json"});
 const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="users.json";
 document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}
document.getElementById("t-users").onclick=()=>{cur="users";editU=null;renderUsers()};
document.getElementById("t-eq").onclick=()=>{cur="eq";editId=null;newC=false;editCid=null;q="";render()};
document.getElementById("t-sys").onclick=()=>{cur="sys";editId=null;newC=false;editCid=null;q="";render()};
boot();
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
</script>
</body>
</html>
